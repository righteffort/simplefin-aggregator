[project]
name = "simplefin-aggregator"
version = "0.1.0"
description = "A SimpleFIN Bridge server that fans out to one or more SimpleFIN providers."
readme = "README.md"
requires-python = ">=3.11"
icense = "GPL-3.0-only"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "typer>=0.27.2",
    "platformdirs>=4.11.5",
]

[project.scripts]
simplefin-aggregator = "simplefin_aggregator.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.2.0",
    "respx>=0.23.1",
    "ruff>=0.16.5",
    "basedpyright>=1.39.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/simplefin_aggregator"]

[tool.ruff]
target-version = "py314"
line-length = 100
exclude = ["stubs/"]

[tool.ruff.lint]
select = [
  "ALL",
]
ignore = [
  "COM812", # missing-trailing-comma -- let the formatter deal with it
  "CPY001", # missing-copyright-notice
  "D10",    # undocumented-public-*
  "D203",   # incorrect-blank-line-before-class
  "D213",   # multi-line-summary-second-line
  "DTZ007", # Naive datetime constructed using `datetime.datetime.strptime()` without %z
  "ERA001", # Commented out code
  "FIX002", # line-contains-todo
  "SLF001", # Private member accessed -- handled by basedpyright
  "T201",   # print
  "T203",   # pprint
  "TC006",  # runtime-cast-value
  "TD002",  # missing-todo-author
  "TD003",  # missing-todo-link
  "UP034",  # extraneous-parentheses -- collides with basedpyright
]

[tool.ruff.lint.extend-per-file-ignores]
"tests/**/*.py" = ["D", "PLR2004", "S101"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false
lines-after-imports = 2

[tool.ruff.format]
docstring-code-format = true
skip-magic-trailing-comma = true

[tool.basedpyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "recommended"
# stubPath = "./stubs"
ignore = ["stubs/**"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
