# simplefin-aggregator config.
#
# This file contains credentials (provider access URLs, client app
# basic-auth password, claim token). It must be readable only by its
# owner: chmod 600 config.toml

# Change bind_host to 0.0.0.0 when running via Docker
bind_host = "127.0.0.1"
bind_port = 8080

# The base URL this aggregator advertises in the access URL it hands
# back from POST /simplefin/claim/{token}. Set it to the URL reachable
# from the client.
base_url = "http://127.0.0.1:8080"

# The secret path segment for POST /simplefin/claim/{token}. Pick a long
# random value; it is a shared secret, not a public constant.
claim_token = "replace-with-a-long-random-token"

[client]
# Basic-auth credentials the client (for example, Actual Budget)
# must present to GET /simplefin/accounts.
username = "actual-budget"
password = "replace-with-a-strong-password"

[[providers]]
name = "someprovider"
# Obtained by running: simplefin-aggregator claim <setup-token>
access_url = "https://user:pass@someprovider.example.com/simplefin"

