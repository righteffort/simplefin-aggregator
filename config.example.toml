# simplefin-aggregator config. See README.md for details.
#
# Holds credentials (the client app password, the claim token), so
# keep this file readable only by its owner.
#
# Provider access URLs are not here. `claim` writes them to
# provider_creds.json, in this same directory.

# 0.0.0.0 when running under Docker.
bind_host = "127.0.0.1"
bind_port = 8080

# The URL this aggregator is reachable at from the client app.
base_url = "http://127.0.0.1:8080"

# Shared secret in the claim URL path. Use a long random value.
claim_token = "replace-with-a-long-random-token"

[client]
# What the client app must present to GET /simplefin/accounts.
username = "actual-budget"
password = "replace-with-a-strong-password"

# The providers to aggregate, by key. Built-in keys: simplefin-bridge,
# lunchflow, redbark.
[[providers]]
key = "simplefin-bridge"

# Providers the built-in list does not name.
#
# [[custom_providers]]
# key = "my-bridge"
# label = "My Own Bridge"
# root = "https://simplefin.example.com/simplefin"
