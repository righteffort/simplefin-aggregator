name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.12', '3.13', '3.14']
      fail-fast: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}

      - name: Lint
        run: uv run ruff check . -q --output-format=github

      - name: Format
        run: uv run ruff format . --diff

      - name: Typecheck
        run: uv run basedpyright

      - name: Test
        run: uv run pytest

  check:
    name: Python CI passed
    if: always()
    permissions: {}

    needs:
      - ci

    runs-on: ubuntu-latest

    steps:
      - name: Decide whether all matrix legs passed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35  # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
