# simplefin-aggregator config. See README.md.

# 0.0.0.0 when running under Docker.
bind_host = "127.0.0.1"
bind_port = 8080

# The URL this aggregator is reachable at from the client app. It is embedded
# in every setup token `app new` prints, so it must be ASCII.
base_url = "http://127.0.0.1:8080"

# The providers to aggregate, by key. Built-in keys: simplefin-bridge,
# lunchflow, redbark.
#
# Your client app sees each account's id with the provider's `prefix` in front,
# defaulting to "<key>:". Changing the prefix for a provider later will make
# all of its accounts appear to be new.
#
# If your client app already syncs straight from a provider, set its prefix = ""
# so that your app continues to see its accounts unchanged.
[[providers]]
key = "simplefin-bridge"
prefix = ""

# [[providers]]
# key = "lunchflow"

# Providers the built-in list does not name.
#
# [[custom_providers]]
# key = "my-bridge"
# label = "My Own Bridge"
# root = "https://simplefin.example.com/simplefin"
