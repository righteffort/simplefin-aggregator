# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

reviews:
  # Default is "chill", which suppresses lower-confidence findings. This repo
  # would rather triage nits by hand than miss something.
  profile: assertive

  path_instructions:
    - path: "src/sf_agg/**"
      instructions: |
        This is a single-user CLI plus a loopback-only HTTP server that
        aggregates SimpleFIN providers.

        Threat model: phishing and paste error. The user obtains a setup token
        from a provider's web page and pastes it into the CLI. A lookalike or
        Unicode-homograph domain yields a token pointing entirely at attacker
        infrastructure; the CLI then stores an access URL on the attacker's
        host, which answers every request made with it -- able to craft an
        arbitrary HTTP response, and learning when and from where each request
        is made. Exact matching of provider URLs against a fixed set of
        known-good origins minimizes the risk (url_validation.py,
        provider_registry.py).

        Out of scope. Do not report these -- they address a different threat
        model and will be rejected:
        - SSRF defenses: destination IP blocking (loopback, link-local,
          RFC1918), DNS pre-resolution or pinning, safeurl-style wrappers.
          There is one principal and no confused deputy, and TLS binds
          identity to the hostname, not to the resolved address.
        - Human confirmation prompts ("is this the host you just visited?") as
          a substitute for the allowlist. They fail precisely in the phishing
          case, because the user's memory of where they were is the attacker's
          domain.
        - Softening the allowlist into a CLI flag or an interactive "add this
          origin?" prompt. A deliberate config-file edit is the only escape
          hatch, by design.
        - Loosening the match to accept a URL whose origin `httpx2.URL` does
          not normalize to the provider's, such as a trailing dot on the host.
          Provider-supplied URLs are normalized by `httpx2.URL` -- the same
          type that later issues the request, which is what makes the origin
          matched and the origin fetched the same one -- and anything that
          survives normalization is meant to fail to match rather than be
          repaired.
        - Constraining the path of a claim or access URL, including "." and
          ".." segments. Only the origin is matched, by design.
        - Dereferencing an account's `currency` field as a URL.
        - Treating a provider key or an account id as a secret. Neither is in
          the secret class above, and both are deliberately rendered. A
          provider key is a machine identifier constrained to `[a-z0-9][a-z0-9-]*` by
          `ProviderEntry.__post_init__`, through which every entry passes; that
          constraint is what makes a key safe to name in a message, so a
          message reached only after it cannot be carrying a pasted secret. An
          account id is rendered in exactly two log lines, named in
          `ARCHITECTURE.md`'s secrets item 5; both use `%r` so a newline cannot
          forge a log line, and the operator needs the id to act on the
          warning. Do not propose replacing either with a fixed string, a
          count, or a digest.
        - Multi-tenancy, rate limiting, and credential encryption at rest
          beyond correct file permissions.
        - An error naming part of a malformed access URL's credentials, when
          an unencoded "/", "?" or "#" in its password ends the authority
          early. `UrlValidationError`'s docstring documents and accepts this
          gap; do not propose generic messages to close it.

        Especially worth reporting:
        - Any path where an access URL, a setup token, or a Basic Auth
          password could reach a log line, an exception message, stdout, or a
          pydantic ValidationError rendering. Only `NormalizedUrl.origin` may
          be rendered; `origin_and_path` holds a claim URL's setup token.
        - Local-filesystem exposure of the access URL store or config.toml:
          file modes, directory modes, symlink following, TOCTOU on write.
        - Any way a redirect could be followed, or a 3xx treated as success,
          on the claim POST or an /accounts GET.
        - Errors in the origin match in url_validation.py, particularly a
          candidate URL that could match an origin it should not, or whose
          fetched origin could differ from the one matched.

    - path: "tests/**"
      instructions: |
        Flag vacuous tests: assertions that would still pass with the code
        under test removed or inverted, mocking that stubs out the very
        behavior being asserted, and tests that assert on an error message
        string without asserting the security-relevant effect.
        Tests must never address a host off this machine; loopback only.

    - path: "docs/**"
      instructions: |
        docs/ARCHITECTURE.md is meant to describe the code as it is. Report
        anything it claims that the code does not do, and anything the code
        does that it does not mention.
