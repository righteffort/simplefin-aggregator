services:
  netns:
    image: registry.k8s.io/pause:3.9
    ports:
      - '127.0.0.1:5006:5006'
      - '127.0.0.1:5026:5026'
    restart: unless-stopped
  actual_server:
    image: docker.io/actualbudget/actual-server:latest
    user: 999:997  # actual:actual on host system
    network_mode: "service:netns"
    depends_on: [netns]
    environment:
      - ACTUAL_UPLOAD_FILE_SYNC_SIZE_LIMIT_MB=1024
      - ACTUAL_UPLOAD_SYNC_ENCRYPTED_FILE_SYNC_SIZE_LIMIT_MB=2048
      - ACTUAL_UPLOAD_FILE_SIZE_LIMIT_MB=2048
    volumes:
      - /var/actual/data:/data
    healthcheck:
      test: ['CMD-SHELL', 'node src/scripts/health-check.js']
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
  simplefin_aggregator:
    image: simplefin-aggregator:latest
    user: 1000:1000  # ME:ME on host system
    network_mode: "service:netns"
    depends_on: [netns]
    volumes:
      - /home/ME/.config/simplefin-aggregator:/config
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5026/simplefin/info', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
